name: E2E smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "e2e/**"
      - "playwright.config.ts"
      - "src/components/pacotes/**"
      - "src/components/cadastro/PacotesClient.tsx"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright package sale
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Só executa o fluxo autenticado quando secrets existem; senão falha cedo com skip documentado.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: List tests
        run: npx playwright test --list
      - name: Authenticated smoke
        if: ${{ secrets.E2E_EMAIL != '' && secrets.E2E_PASSWORD != '' && secrets.E2E_TENANT_SLUG != '' && secrets.E2E_BASE_URL != '' }}
        run: npm run test:e2e:smoke
        env:
          E2E_SKIP_WEBSERVER: "1"
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_TENANT_SLUG: ${{ secrets.E2E_TENANT_SLUG }}
      - name: Skip notice
        if: ${{ secrets.E2E_EMAIL == '' || secrets.E2E_BASE_URL == '' }}
        run: |
          echo "Secrets E2E_* ausentes — smoke autenticado não rodou."
          echo "Configure E2E_BASE_URL, E2E_EMAIL, E2E_PASSWORD, E2E_TENANT_SLUG no repositório."
          echo "Local: E2E_EMAIL=… E2E_PASSWORD=… E2E_TENANT_SLUG=… npm run test:e2e:smoke"
